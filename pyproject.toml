[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-splitter"
version = "0.1.0"
description = "把一首成品歌拆成人声 / 鼓 / 贝斯 / 其它（ShadowRoom Music）"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "AGPL-3.0" }
keywords = ["stems", "source-separation", "demucs", "mcp", "shadowroom"]
# The MCP server itself is stdlib + numpy only; the model lives in its own virtualenv.
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
# `pip install "stem-splitter[local]"` installs the separator into the same environment.
local = ["demucs>=4.0.1"]

[project.urls]
Homepage = "https://shadowroom.cn"
Tools = "https://shadowroom.cn/tools"
Repository = "https://github.com/shadowroommusic"

[project.scripts]
shadow-stem-splitter = "shadow_stem_splitter.cli:main"
shadow-stem-splitter-mcp = "shadow_stem_splitter.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
